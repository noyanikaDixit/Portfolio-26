<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #FDFBF7;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
  }
  .frame {
    width: 1136px; height: 566px;
    border: 1px solid #E5E5E5;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; position: relative;
  }
  .eyebrow {
    font-size: 15px; letter-spacing: 6px; text-transform: uppercase;
    color: #4A0E4E; font-weight: 500; margin-bottom: 28px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 104px; font-weight: 600; letter-spacing: -3px;
    color: #111111; line-height: 1;
  }
  h1 em { color: #4A0E4E; font-weight: 500; }
  .tag {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 30px; color: #555555; margin-top: 30px;
  }
  .rule { width: 64px; height: 2px; background: #4A0E4E; margin-top: 40px; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Creative Strategist — Brand, Content &amp; Conversion</p>
    <h1>Noyanika <em>Dixit</em></h1>
    <p class="tag">Curious mind. Creative instinct. Ideas people remember.</p>
    <div class="rule"></div>
  </div>
</body>
</html>
